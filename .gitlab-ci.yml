# self.speak CI — yard-native image build.
# buildkit-rootless on bigbuild -> container.home (gitlab-profile#60 /
# self.infrastructure#143). NOT kaniko: kaniko's writable layer always lands on
# the node's containerd root and can't be redirected (OOM-ing tight nodes);
# buildkit's state is a flag (`--root`) pointed at the /builds mount, rootless.
# The kaniko-only memory workarounds (--compressed-caching / --single-snapshot)
# that the GPU build needed against the torch+cu129 OOM are DROPPED — buildkit
# streams layers and doesn't hit kaniko's in-memory-tar ceiling.
# CPU image: model baked in at build time via docker/cpu/Dockerfile.
#
# Two-job split (selfinfra/zlib reference): build:* is the gate (builds, NO
# push); publish:* builds + pushes on main only.

stages: [lint, test, build, publish]

include:
  - project: 'selfshipyard/selfai/self.ai'
    ref: main
    file: '.gitlab/ci-templates/sync-public-alpha.yml'

default:
  tags: [bigbuild]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  BUILDKIT_IMAGE: "moby/buildkit:v0.31.2-rootless"   # pinned, not master
  # Force a FRESH clone every build. The bigbuild runner keeps a persistent
  # checkout on its scratch PVC; on 2026-07-31 that checkout went STALE (stuck at
  # the pre-setuptools-fix commit, likely a silently-failed fetch during the
  # registry/DNS flakiness), so buildkit's --local context fed OLD source and every
  # GPU image shipped a pre-fix requirements-chatterbox.txt + a worker venv missing
  # setuptools -> every Chatterbox synth 500'd. GIT_STRATEGY=clone + a clean wipe
  # make a stale checkout impossible.
  GIT_STRATEGY: clone
  GIT_CLEAN_FLAGS: "-ffdx"
  # Bursty CI jobs: SMALL requests so a job schedules even on a busy node, HIGH
  # limits so it can burst when it actually runs. These jobs sit idle until
  # triggered, need real CPU/RAM only briefly, and don't all run at once — so
  # right-sizing the request (not the limit) is what lets k8s bin-pack them.
  # Requires the runner to permit resource overwrites (self.infrastructure#173).
  KUBERNETES_CPU_REQUEST: "250m"
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_MEMORY_REQUEST: "1Gi"
  KUBERNETES_MEMORY_LIMIT: "16Gi"

# Registry auth + buildkit state dir, both OUTSIDE the build context (a SIBLING
# of $CI_PROJECT_DIR): the CI_JOB_TOKEN credential must never sit where a
# `COPY . .` could bake it into the image (gitlab-profile#60 trap 3). --root
# points build bytes at the /builds mount, off the node containerd root (#143).
.buildkit-before: &buildkit-before
  - export BK_SCRATCH="${CI_BUILDS_DIR:-/builds}/.buildkit"
  - mkdir -p "$BK_SCRATCH" 2>/dev/null || export BK_SCRATCH="$(dirname "$CI_PROJECT_DIR")/.buildkit"
  - mkdir -p "$BK_SCRATCH/state" "$BK_SCRATCH/docker"
  - export DOCKER_CONFIG="$BK_SCRATCH/docker"
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_JOB_TOKEN" | base64 | tr -d '\n')\"}}}" > "$DOCKER_CONFIG/config.json"
  - chmod 600 "$DOCKER_CONFIG/config.json"
  - export BUILDKITD_FLAGS="--oci-worker-no-process-sandbox --root $BK_SCRATCH/state"

# --- publish: mirror main -> public-alpha (GitLab + GitHub), scheduled only -
sync:public-alpha:
  extends: .sync-public-alpha
  variables:
    MIRROR_EXCLUDE_PATHS: ""

# --- lint: ruff (import-sort only) — lightweight, on yard ---
lint:ruff:
  stage: lint
  image: python:3.10-slim-bookworm
  tags: [yard]
  before_script:
    - pip install --no-cache-dir ruff~=0.6.9
  script:
    - ruff check .

# --- test: pytest against api/tests/ — lightweight, on yard ---
test:pytest:
  stage: test
  image: python:3.10-slim-bookworm
  tags: [yard]
  timeout: 20m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        build-essential espeak-ng espeak-ng-data git libsndfile1 curl ffmpeg g++ cmake
        && rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir uv
    - uv pip install --system -e .[test,cpu]
  script:
    - python -m pytest api/tests/ --asyncio-mode=auto --cov=api --cov-report=term-missing
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- build: CPU image — MR gate (build, NO push) ---
build:self-speak:
  stage: build
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 1h
  before_script: *buildkit-before
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/docker/cpu"
      --import-cache "type=registry,ref=${IMAGE}/cache"
      --export-cache "type=registry,ref=${IMAGE}/cache,mode=max"

# --- publish: CPU image — build + push :sha / :latest (main only) ---
publish:self-speak:
  stage: publish
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 1h
  before_script: *buildkit-before
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export TAGS="${IMAGE}:${CI_COMMIT_SHORT_SHA},${IMAGE}:latest"
    - 'export OUT="type=image,\"name=${TAGS}\",push=true"'
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/docker/cpu"
      --import-cache "type=registry,ref=${IMAGE}/cache"
      --export-cache "type=registry,ref=${IMAGE}/cache,mode=max"
      --output "$OUT"

# --- build: GPU image (CUDA + torch cu129) — MANUAL MR gate (opt-in, no push) ---
# Heavy cudnn-DEVEL + torch+cu129 build; manual on MRs so routine MRs don't tie
# up the shared bigbuild runner for hours, auto on main. allow_failure so a
# skipped/failed opt-in gate never blocks an MR that didn't need it.
#
# NOTE (2026-07-30): the GPU cache ref is `cache-gpu2`, not `cache-gpu`. The
# original cache-gpu got POISONED — after requirements-chatterbox.txt changed
# (adding setuptools<81) AND the Dockerfile got a cache-bust ARG, buildkit still
# reported every layer CACHED and republished a byte-identical image (gpu-4e2b4314
# == gpu-24f651ee == gpu-0583c6f0, same sha256:d9bdba30), so the setuptools fix
# never reached the image. Rotating to a fresh cache key forces one clean rebuild
# and leaves normal caching intact going forward. If this recurs, rotate again
# (cache-gpu3) or add --no-cache to a one-off build.
build:self-speak-gpu:
  stage: build
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 3h
  before_script: *buildkit-before
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/docker/gpu"
      --import-cache "type=registry,ref=${IMAGE}/cache-gpu2"
      --export-cache "type=registry,ref=${IMAGE}/cache-gpu2,mode=max"

# --- publish: GPU image — build + push :gpu-sha / :gpu-latest (main only) ---
publish:self-speak-gpu:
  stage: publish
  image: { name: "$BUILDKIT_IMAGE", entrypoint: [""] }
  timeout: 3h
  before_script: *buildkit-before
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export TAGS="${IMAGE}:gpu-${CI_COMMIT_SHORT_SHA},${IMAGE}:gpu-latest"
    - 'export OUT="type=image,\"name=${TAGS}\",push=true"'
    - >
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/docker/gpu"
      --import-cache "type=registry,ref=${IMAGE}/cache-gpu2"
      --export-cache "type=registry,ref=${IMAGE}/cache-gpu2,mode=max"
      --output "$OUT"
