[project]
name = "self-speak"
version = "0.3.0"
description = "self.ai TTS service — GPLv3 fork of Kokoro-FastAPI (Apache-2.0)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core dependencies
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    # Required by FastAPI to parse multipart/form-data — the Chatterbox clone/
    # preview routes (routers/control.py) take the reference clip as an upload.
    # Without it FastAPI raises at route registration, so ANY import of `app`
    # (incl. the whole test suite) fails collection, not just the clone routes.
    "python-multipart==0.0.20",
    "click>=8.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.27",
    # Service-ticket auth (self.ai#25) -- validates the X-Selfai-Ticket JWT
    # self.ai mints before calling /v1/audio/speech. Same pin as self.ai's
    # api/requirements.txt and self.llamolotl's, so all three sides of the
    # mesh agree on the library version.
    "PyJWT[crypto]==2.13.0",
    # ML/DL Base
    "numpy>=1.26.0",
    "scipy==1.14.1",
    # Audio processing
    "soundfile==0.13.0",
    "regex==2024.11.6",
    # Utilities
    "aiofiles==23.2.1",
    "tqdm==4.67.1",
    "requests==2.32.3",
    # Async client for the main process -> Chatterbox worker localhost proxy
    # (api/src/inference/chatterbox_client.py, INTEGRATION-PLAN-v2.md §1.4).
    # Promoted from the test-only extra: `uv sync --extra gpu` (the runtime venv)
    # does NOT install the test extra, so the client needs httpx as a main dep.
    "httpx==0.26.0",
    "munch==4.0.0",
    "tiktoken==0.8.0",
    "loguru==0.7.3",
    "openai>=1.59.6",
    "pydub>=0.25.1",
    "matplotlib>=3.10.0",
    "mutagen>=1.47.0",
    "psutil>=6.1.1",
    "espeakng-loader==0.2.4",
    "kokoro==0.9.4",
    "misaki[en,ja,ko,zh]==0.9.4",
    "spacy==3.8.5",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "inflect>=7.5.0",
    "phonemizer-fork>=3.3.2",
    "av>=14.2.0",
    "text2num>=2.5.1",
    # Context-free card occupancy for the VRAM probe (self.speak#8). NVML is the
    # only way to read whole-card used/free WITHOUT creating a CUDA primary
    # context; torch.cuda.mem_get_info() creates one (386 MiB measured on the
    # deployed 4090) and only process exit gives it back. Same library self.sketch
    # and self.curator already use for the same reason.
    "nvidia-ml-py>=12.560.30",
]

[project.optional-dependencies]
gpu = ["torch==2.8.0+cu129"]
cpu = ["torch==2.8.0"]
rocm = [
    "torch==2.8.0+rocm6.4",
    "pytorch-triton-rocm>=3.2.0",
]
test = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    # httpx moved to the main [project] dependencies (runtime needs it for the
    # Chatterbox worker proxy); kept resolvable here transitively.
    "pytest-asyncio==0.25.3",
    "tomli>=2.0.1",
    "jinja2>=3.1.6",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
        { extra = "rocm" },
    ],
]
override-dependencies = [
    "triton>=3.5.1 ; platform_machine == 'aarch64'"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "api/src" }
packages.find = { where = ["api/src"], namespaces = true }

[tool.pytest.ini_options]
testpaths = ["api/tests", "ui/tests"]
python_files = ["test_*.py"]
addopts = "--cov=api --cov=ui --cov-report=term-missing --cov-config=.coveragerc --full-trace"
asyncio_mode = "auto"
